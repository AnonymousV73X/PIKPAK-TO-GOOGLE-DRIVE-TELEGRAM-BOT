<!DOCTYPE html>
<html lang="en" data-theme="{{ theme|default('dark') }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Relay — PikPak to Drive{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">
        <span class="node node-a"></span>
        <span class="node node-b"></span>
        <span class="link"></span>
      </span>
      <span class="brand-name">Relay</span>
    </a>
    <nav class="topnav">
      <a href="/" class="{{ 'active' if request.path == '/' else '' }}">Dashboard</a>
      <a href="/wizard" class="{{ 'active' if request.path == '/wizard' else '' }}">Setup</a>
      <a href="/help" class="{{ 'active' if request.path == '/help' else '' }}">Help</a>
    </nav>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle light / dark">
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main class="content">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span>Relay · local rclone control panel</span>
    <span class="footer-os">{{ os_info.os }} · {{ os_info.arch }}</span>
  </footer>
</div>
<script src="/static/js/custom-select.js"></script>
<script src="/static/js/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
